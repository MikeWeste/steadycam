plugins { id 'com.android.application' }
android {
    namespace 'com.example.steadycam'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.example.steadycam'
        minSdk 29
        targetSdk 35
        versionCode 3
        versionName '2.1'
    }
    signingConfigs {
        debug {
            storeFile file('../signing/development.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
